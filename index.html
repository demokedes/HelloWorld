<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bitcoin Investment Tracker</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: radial-gradient(circle at top, #1f2937, #0f172a);
        color: #f9fafb;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
      }

      .card {
        width: min(960px, 100%);
        background: rgba(15, 23, 42, 0.9);
        border-radius: 20px;
        box-shadow: 0 30px 80px rgba(15, 23, 42, 0.4);
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.25);
      }

      header {
        padding: 2rem;
        display: flex;
        flex-wrap: wrap;
        gap: 1.5rem;
        align-items: baseline;
        justify-content: space-between;
        background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), transparent);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 2.5rem);
        font-weight: 600;
        letter-spacing: -0.03em;
      }

      .summary {
        display: flex;
        flex-wrap: wrap;
        gap: 1.5rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .summary-item {
        display: grid;
        gap: 0.35rem;
      }

      .summary-label {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: rgba(226, 232, 240, 0.8);
      }

      .summary-value {
        font-size: 1.35rem;
        font-weight: 600;
      }

      canvas {
        width: 100%;
        max-width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
      }

      .chart-container {
        padding: 1.5rem 2rem 2.5rem;
        background: rgba(15, 23, 42, 0.75);
      }

      .footer-note {
        padding: 1rem 2rem 2rem;
        font-size: 0.9rem;
        color: rgba(226, 232, 240, 0.75);
      }

      a {
        color: rgb(96, 165, 250);
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
    <script defer>
      const INVESTMENT_USD = 247;
      const API_URL =
        "https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=1&interval=minute";

      async function fetchMarketChart() {
        const response = await fetch(API_URL, {
          headers: { "accept": "application/json" },
        });
        if (!response.ok) {
          throw new Error(`Failed to fetch data (${response.status})`);
        }
        const { prices } = await response.json();
        return prices.map(([timestamp, price]) => ({
          date: new Date(timestamp),
          price,
        }));
      }

      function formatCurrency(value) {
        return new Intl.NumberFormat("en-US", {
          style: "currency",
          currency: "USD",
          maximumFractionDigits: 2,
        }).format(value);
      }

      function renderSummary({ latestPrice, investmentValue, changePercent }) {
        document.querySelector("[data-current-price]").textContent =
          formatCurrency(latestPrice);
        document.querySelector("[data-current-value]").textContent =
          formatCurrency(investmentValue);
        const changeElement = document.querySelector("[data-change]");
        const formattedChange = `${changePercent >= 0 ? "+" : ""}${changePercent.toFixed(2)}%`;
        changeElement.textContent = formattedChange;
        changeElement.style.color = changePercent >= 0 ? "#4ade80" : "#f87171";
      }

      function initialiseChart(ctx, labels, dataset) {
        return new Chart(ctx, {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: "Portfolio value",
                data: dataset,
                borderColor: "#38bdf8",
                backgroundColor: "rgba(56, 189, 248, 0.2)",
                tension: 0.35,
                fill: true,
                pointRadius: 0,
              },
            ],
          },
          options: {
            animation: false,
            maintainAspectRatio: false,
            scales: {
              x: {
                ticks: {
                  maxTicksLimit: 6,
                },
              },
              y: {
                ticks: {
                  callback: (value) => `$${value}`,
                },
              },
            },
            plugins: {
              legend: {
                display: false,
              },
              tooltip: {
                callbacks: {
                  label: (context) => formatCurrency(context.parsed.y),
                },
              },
            },
          },
        });
      }

      function computeInvestmentSeries(prices) {
        if (!prices.length) {
          return { labels: [], values: [] };
        }
        const btcAmount = INVESTMENT_USD / prices[0].price;
        const labels = prices.map(({ date }) =>
          date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
        );
        const values = prices.map(({ price }) => price * btcAmount);
        return { btcAmount, labels, values };
      }

      async function updateChart(chart) {
        try {
          const prices = await fetchMarketChart();
          const { labels, values } = computeInvestmentSeries(prices);
          chart.data.labels = labels;
          chart.data.datasets[0].data = values;
          chart.update();

          const latestValue = values.at(-1);
          const firstValue = values[0];
          const changePercent = ((latestValue - firstValue) / firstValue) * 100;
          const latestPrice = prices.at(-1)?.price ?? 0;
          renderSummary({
            latestPrice,
            investmentValue: latestValue,
            changePercent,
          });
        } catch (error) {
          console.error(error);
          const status = document.querySelector("[data-status]");
          status.textContent = "Unable to load market data. Please try again later.";
        }
      }

      document.addEventListener("DOMContentLoaded", async () => {
        const ctx = document.getElementById("btc-chart").getContext("2d");
        const chart = initialiseChart(ctx, [], []);
        await updateChart(chart);
        setInterval(() => updateChart(chart), 60_000);
      });
    </script>
  </head>
  <body>
    <main class="card">
      <header>
        <h1>Bitcoin Investment Tracker</h1>
        <ul class="summary">
          <li class="summary-item">
            <span class="summary-label">Current BTC price</span>
            <span class="summary-value" data-current-price>Loading…</span>
          </li>
          <li class="summary-item">
            <span class="summary-label">Portfolio value</span>
            <span class="summary-value" data-current-value>Loading…</span>
          </li>
          <li class="summary-item">
            <span class="summary-label">Change (24h)</span>
            <span class="summary-value" data-change>Loading…</span>
          </li>
        </ul>
      </header>
      <div class="chart-container">
        <canvas id="btc-chart"></canvas>
      </div>
      <p class="footer-note" data-status>
        Tracking performance of a $247 investment in Bitcoin using price data from
        <a href="https://www.coingecko.com" target="_blank" rel="noreferrer">CoinGecko</a>.
        Data refreshes every minute.
      </p>
    </main>
  </body>
</html>
